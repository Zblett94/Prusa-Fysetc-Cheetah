name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Motion engine unit test
        run: sh test/motion/run.sh

      - name: Display driver unit test
        run: sh test/lcd/run.sh

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e MK3S_SKR_MINI_E3_V3

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-MK3S_SKR_MINI_E3_V3
          path: .pio/build/MK3S_SKR_MINI_E3_V3/firmware.bin

      - name: Build with the original MK3S LCD (compile check)
        run: PLATFORMIO_BUILD_FLAGS=-DLCD_MK3S pio run -e MK3S_SKR_MINI_E3_V3
