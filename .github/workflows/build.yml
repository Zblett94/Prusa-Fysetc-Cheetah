name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Motion engine unit test
        run: sh test/motion/run.sh

      - name: Display driver unit tests
        run: sh test/lcd/run.sh && sh test/tft/run.sh

      - name: Flash EEPROM emulation test (Cheetah V3, with power cuts)
        run: sh test/eeprom/run.sh

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e MK3S_SKR_MINI_E3_V3

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-MK3S_SKR_MINI_E3_V3
          path: .pio/build/MK3S_SKR_MINI_E3_V3/firmware.bin

      - name: Build with the original MK3S LCD (compile check)
        run: PLATFORMIO_BUILD_FLAGS=-DLCD_MK3S pio run -e MK3S_SKR_MINI_E3_V3

      - name: Build with the Creality Ender-3 display (compile check)
        run: PLATFORMIO_BUILD_FLAGS=-DLCD_ENDER3 pio run -e MK3S_SKR_MINI_E3_V3

      - name: Build for the FYSETC Cheetah V3
        run: pio run -e MK3S_CHEETAH_V3

      - name: Upload Cheetah V3 firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-MK3S_CHEETAH_V3
          path: |
            .pio/build/MK3S_CHEETAH_V3/firmware.hex
            .pio/build/MK3S_CHEETAH_V3/firmware_0x08000000.bin
            .pio/build/MK3S_CHEETAH_V3/firmware_0x0800C000.bin

      - name: Build for the Cheetah V3 without MMU (compile check)
        run: PLATFORMIO_BUILD_FLAGS=-DCHEETAH_NO_MMU pio run -e MK3S_CHEETAH_V3
