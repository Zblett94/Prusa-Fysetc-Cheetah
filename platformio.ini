#
# Prusa-Firmware 3.14.1 (MK3S) for the BigTreeTech SKR Mini E3 V3.0
#
# Build:   pio run
# Output:  .pio/build/MK3S_SKR_MINI_E3_V3/firmware.bin
# Install: copy firmware.bin to the root of the board's micro-SD card and power cycle.
#
[platformio]
src_dir          = Firmware
boards_dir       = buildroot/boards
default_envs     = MK3S_SKR_MINI_E3_V3

[env:MK3S_SKR_MINI_E3_V3]
platform          = ststm32@17.1.0
platform_packages = framework-arduinoststm32@~4.20600.231001
                    toolchain-gccarmnoneeabi@1.120301.0
framework         = arduino
board             = btt_skr_mini_e3_v3
board_build.core  = stm32
board_build.variants_dir = buildroot/variants
board_build.variant      = MARLIN_G0B1RE
board_build.offset       = 0x2000
board_upload.offset_address = 0x08002000
extra_scripts     = buildroot/scripts/offset.py
                    post:buildroot/scripts/lang.py
build_unflags     = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags       = -std=gnu++17
                    -IFirmware/hal_stm32/include
                    -DPRUSA_MK3_FW
                    -D_NO_ASM
                    -DLANG_MODE=1
                    -DFW_REPOSITORY=\"Prusa-SKR-Mini\"
                    -DFW_VARIANT=\"variants/MK3S-SKR_MINI_E3_V3.h\"
                    -DUSBCON -DUSBD_USE_CDC -DHAL_PCD_MODULE_ENABLED
                    -DSERIAL_RX_BUFFER_SIZE=256 -DSERIAL_TX_BUFFER_SIZE=256
                    -DTIMER_TONE=TIM4 -DTIMER_SERVO=TIM14
                    -DTIM_IRQ_PRIO=3 -DUSBD_IRQ_PRIO=1 -DUART_IRQ_PRIO=1
                    -fsingle-precision-constant
                    -fsigned-char
                    -Wno-register -Wno-deprecated-declarations
                    -Wl,--no-warn-rwx-segment
                    -DPIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
# AVR-only sources (external SPI flash, optiboot, AVR timers, AVR UART/TWI drivers) are
# replaced by the STM32 HAL in Firmware/hal_stm32
build_src_filter  = +<*> -<.git/> -<obsolete/> -<variants/>
                    -<bootapp.c> -<optiboot_xflash.cpp> -<xflash.c> -<xflash_dump.cpp>
                    -<timer02.c> -<tone04.c> -<twi.cpp> -<swi2c.c> -<spi.c> -<uart2.c> -<rbuf.c> -<pat9125.cpp>
upload_protocol   = stlink
debug_tool        = stlink
monitor_speed     = 115200

#
# Test build for the Renode emulator (test/renode). Not for a real printer:
# the host serial is USART2 instead of USB and the EXTI / TMC2209 accesses are stubbed.
#
[env:renode_test]
extends           = env:MK3S_SKR_MINI_E3_V3
build_flags       = ${env:MK3S_SKR_MINI_E3_V3.build_flags}
                    -DEMULATION
